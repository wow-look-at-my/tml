name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write
  pull-requests: write

jobs:
  validate-xml:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/xml-validator@lkgb
        with:
          files: '**/*.tml **/*.xsd **/*.xml'
      # syntax/testdata holds documents the parser must reject, so the grammar is not their judge.
      - uses: wow-look-at-my/xml-validator@lkgb
        with:
          schema: tml.schema.xsd
          files: 'examples/**/*.tml testdata/dashboard/*.tml testdata/grid/*.tml testdata/inspect/*.tml testdata/schema/valid/*.tml'

  test:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # The prose gate, at the top of the job. A finding is about the checkout, so it fails here rather than after the build.
      - uses: wow-look-at-my/actions@ste-lint#latest

      # inspect/ui/inspector.js is compiled from inspect/ui/src, and committed because go:embed reads the module's tree.
      - uses: extractions/setup-just@v2
      - name: Compile the inspector page
        run: corepack enable && pnpm install && just build
      - name: Check the committed page is what its source compiles to
        run: git diff --exit-code -- inspect/ui/inspector.js

      # Go fetches the private org modules through git, which needs the vended token.
      - uses: wow-look-at-my/actions@secret-server#latest
      - if: env.PRIVATE_ORG_REPO_READ != ''
        run: git config --global credential.https://github.com.helper '!f() { echo username=x-access-token; echo password=$PRIVATE_ORG_REPO_READ; }; f'

      # cosmo-platforms names the hosts the one fat APE covers. The action dropped the os= and arch= inputs it used to take.
      - uses: wow-look-at-my/go-toolchain@lkgb
        # A hung test fails with every goroutine's stack. The step's own limit kills it silently.
        env:
          GOFLAGS: -timeout=7m
        with:
          cosmo-platforms: linux/amd64,linux/arm64,darwin/arm64,windows/amd64

      # The screenshots are taken from the binaries this job just built, in Ghostty -- see docs/screenshots.md
      - name: Install Ghostty and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:mkasberg/ghostty-ubuntu
          sudo apt-get update
          sudo apt-get install -y ghostty xvfb xdotool imagemagick libgl1 libgl1-mesa-dri libegl1
      - name: Capture the screenshots
        run: node tools/shots/capture.mjs
        env:
          SHOTS_BRANCH: ${{ github.ref_name }}

      # The inspector check proves a running program's own drawn output -- see docs/inspector.md
      - name: Install the inspector check
        run: npm install --no-audit --no-fund
        working-directory: tools/inspector-check
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: tools/inspector-check
      - name: Check the inspector against a running program
        run: node tools/inspector-check/check.mjs

      - name: Publish the screenshots
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@lkgb
        with:
          # The project name must match the repository name: buildhost's OIDC trust only covers that name, and anything else 404s.
          branch: ${{ github.ref_name }}
          source_dir: build/shots
          deployment_ref: ${{ github.ref_name }}
          # The README embeds these, so they are served to anyone who opens it.
          public: 'true'
