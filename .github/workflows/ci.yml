name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    # The wow-linux pool (CI_RUNNER) runs in an unprivileged container whose
    # seccomp profile denies unshare(CLONE_NEWUSER), so bwrap cannot sandbox,
    # and docker is not on PATH either. dats then fails closed. The dind pool
    # is the one dats' own action tells consumers to use (CI_RUNNER_DIND).
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # dats always sandboxes. Try bubblewrap first (host python3, host tml);
      # if the kernel or the job container refuses a user namespace, docker
      # is the fallback — which is why this job is on the dind pool.
      - name: Provision a dats sandbox backend
        run: |
          command -v bwrap >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y bubblewrap)
          if bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true; then
            echo "bwrap works"
            exit 0
          fi
          for knob in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone; do
            path="/proc/sys/${knob//./\/}"
            if [ -f "$path" ]; then
              sudo sysctl -w "$knob=0" || true
            fi
          done
          if bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp --unshare-pid --die-with-parent true; then
            echo "bwrap works after clearing the restriction"
            exit 0
          fi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "bwrap blocked; dats will fall back to docker"
            exit 0
          fi
          echo "::error::No usable sandbox backend: bwrap is blocked and docker is unavailable."
          exit 1

      # Native per-platform binaries, not the default single fat APE. bubbletea
      # and clipboard carry no GOOS=cosmo files, so the APE build cannot
      # compile this tree.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          os: linux,darwin,windows
          arch: amd64,arm64

      # The screenshots are taken from the binaries this job just built, in a
      # real terminal. see docs/screenshots.md
      - name: Install ttyd
        run: sudo apt-get update && sudo apt-get install -y ttyd
      - name: Install the capture tool
        run: npm install --no-audit --no-fund
        working-directory: tools/shots
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: tools/shots
      - name: Capture the screenshots
        run: node tools/shots/capture.mjs
        env:
          SHOTS_BRANCH: ${{ github.ref_name }}

      # The inspection layer is only worth having if it reports what a running
      # program actually drew, so it is checked against one: the CLI over the
      # socket, then the browser inspector driven with a pointer.
      # see docs/inspector.md
      - name: Install the inspector check
        run: npm install --no-audit --no-fund
        working-directory: tools/inspector-check
      - name: Check the inspector against a running program
        run: node tools/inspector-check/check.mjs

      - name: Publish the screenshots
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          # The project is the repository name, which is the one buildhost's
          # OIDC trust covers -- naming anything else 404s with "project not
          # found" rather than creating it.
          branch: ${{ github.ref_name }}
          source_dir: build/shots
          deployment_ref: ${{ github.ref_name }}
          # tml is private and the pictures are of example programs, so the site
          # is served without a credential -- which is what lets the README show
          # them.
          public: 'true'
