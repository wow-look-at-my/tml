name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write
  pull-requests: write

jobs:
  # Every XML document in the tree, for well-formedness and XML 1.1, and every component against the grammar.
  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/xml-validator@master
        with:
          files: '**/*.tml **/*.xsd **/*.xml'
      # syntax/testdata holds documents the parser must reject, so the grammar is not their judge.
      - uses: wow-look-at-my/xml-validator@master
        with:
          schema: tml.schema.xsd
          files: 'examples/**/*.tml testdata/dashboard/*.tml testdata/grid/*.tml testdata/inspect/*.tml testdata/schema/valid/*.tml'

  test:
    runs-on: ${{ vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # inspect/ui/inspector.js is compiled from inspect/ui/src, and committed because go:embed reads the module's tree.
      - uses: extractions/setup-just@v2
      - name: Compile the inspector page
        run: corepack enable && pnpm install && just build
      - name: Check the committed page is what its source compiles to
        run: git diff --exit-code -- inspect/ui/inspector.js

      # dats/schema.dats drives xml-validator itself, and its sandbox only sees a system path, so this installs the package rather than a binary under the runner's temp.
      - name: Install xml-validator
        run: curl -fsSL https://apt.pazer.build/xml-validator/install.sh | sudo sh && sudo apt-get install -y xml-validator

      # cosmo-platforms names the hosts the one fat APE covers. The action dropped the os= and arch= inputs it used to take.
      - uses: wow-look-at-my/go-toolchain@master
        # A hung test fails with every goroutine's stack. The step's own limit kills it silently.
        env:
          GOFLAGS: -timeout=7m
        with:
          cosmo-platforms: linux/amd64,linux/arm64,darwin/arm64,windows/amd64

      # The screenshots are taken from the binaries this job just built, in a real terminal -- see docs/screenshots.md
      - name: Install ttyd
        run: sudo apt-get update && sudo apt-get install -y ttyd
      - name: Install the capture tool
        run: npm install --no-audit --no-fund
        working-directory: tools/shots
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: tools/shots
      - name: Capture the screenshots
        run: node tools/shots/capture.mjs
        env:
          SHOTS_BRANCH: ${{ github.ref_name }}

      # The inspector check proves a running program's own drawn output -- see docs/inspector.md
      - name: Install the inspector check
        run: npm install --no-audit --no-fund
        working-directory: tools/inspector-check
      - name: Check the inspector against a running program
        run: node tools/inspector-check/check.mjs

      - name: Publish the screenshots
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          # The project name must match the repository name: buildhost's OIDC trust only covers that name, and anything else 404s.
          branch: ${{ github.ref_name }}
          source_dir: build/shots
          deployment_ref: ${{ github.ref_name }}
          # The README embeds these, so they are served to anyone who opens it.
          public: 'true'
