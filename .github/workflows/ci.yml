name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

      # The screenshots are taken from the binaries this job just built, in a
      # real terminal. see docs/screenshots.md
      - name: Install ttyd and a browser
        run: sudo apt-get update && sudo apt-get install -y ttyd chromium
      - name: Install the capture tool
        run: npm install --prefix tools/shots --no-audit --no-fund
      - name: Capture the screenshots
        run: node tools/shots/capture.mjs
        env:
          SHOTS_BRANCH: ${{ github.ref_name }}

      - name: Publish the screenshots
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          project: tml-shots
          branch: ${{ github.ref_name }}
          source_dir: build/shots
          deployment_ref: ${{ github.ref_name }}
          # tml is private and the pictures are of example programs, so the site
          # is served without a credential -- which is what lets the README show
          # them.
          public: 'true'
